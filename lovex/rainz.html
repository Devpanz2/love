  <style>
    @font-face {
      font-family: 'Playpen Sans';
      src: url('./assets/PlaypenSans.ttf') format('truetype');
      font-weight: bold;
      font-style: normal;
      font-display: block;
    }

    html,
    body {
      font-family: "Playpen Sans", cursive;
      margin: 0;
      overflow: hidden;
      background: #000;
      height: 100vh;
      width: 100vw;
      position: relative;
      color: white;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }

    #sticker {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 450px;
      height: auto;
      z-index: 10;
      pointer-events: none;
    }

    #pinkboard {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9;
      pointer-events: none;
    }

    audio {
      display: none;
    }

    @media (max-width: 768px) {
      #sticker {
        width: 300px;
      }
    }

    #rotateWarning {
      position: fixed;
      inset: 0;
      background: #666666;
      color: #fff;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    #rotateWarning img {
      width: 120px;
      margin-bottom: 15px;
      animation: rotateHint 1.5s infinite;
    }

    @keyframes rotateHint {
      0% {
        transform: rotate(0deg);
      }

      50% {
        transform: rotate(90deg);
      }

      100% {
        transform: rotate(0deg);
      }
    }
  </style>
